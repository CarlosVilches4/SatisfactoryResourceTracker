<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Iniciar sessió</h1>
      <p class="subtitol">Accedeix al teu compte</p>
    </div>
    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="camp">
        <label for="email">Email:</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="nom@exemple.com" required
          [disabled]="carregant">
      </div>

      <div class="camp">
        <label for="password">Contrasenya:</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••" required
          [disabled]="carregant">
      </div>

      <p *ngIf="error" class="error">{{ error }}</p>

      <button type="submit" [disabled]="loginForm.invalid || carregant" class="btn-login">
        {{ carregant ? 'Entrant...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
